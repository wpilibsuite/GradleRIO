
def wpilibVersionKeys = [
  'wpilibVersion',
  'outlineViewerVersion',
  'glassVersion',
  'sysIdVersion',
  'dataLogToolVersion',
  'wpicalToolVersion',
  'processstarterToolVersion',
]

// These dependencies use the versions selected by the corresponding WPILib build,
// rather than the WPILib build version itself.
def thirdPartyVersionMap = [
  opencvVersion: 'opencv',
  avajeVersion: 'avaje',
  ejmlVersion: 'ejml',
  quickbufVersion: 'quickbuf',
  gsonVersion: 'gson',
  mrcLibVersion: 'mrclib',
]

configurations {
  gradleRioVersions
}

configurations.gradleRioVersions.resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'

// We need some special logic to switch the processstarter tool between development and release repositories
def currentUseDevelopment = true

def switchToDevelopment = 'switchToDevelopment'
def switchToRelease = 'switchToRelease'

def useDevelopment = project.hasProperty(switchToDevelopment) || (currentUseDevelopment && !project.hasProperty(switchToRelease))

project.repositories.maven { repo ->
    repo.name = "WPI"
    if (useDevelopment) {
      repo.url = "https://frcmaven.wpi.edu/artifactory/development-2027"
    } else {
      repo.url = "https://frcmaven.wpi.edu/artifactory/release-2027"
    }
}

dependencies {
  gradleRioVersions 'org.wpilib:wpilib-versions:+'
}

String regex = "String\\s+?placeholder\\s+?=\\s+?[\\\"|\\'].+?[\\\"|\\']"
String buildRegex = "def\\s+?placeholder\\s+?=\\s+?[\\\"|\\'].+?[\\\"|\\']"
String mavenDevRegex = "this\\.useDevelopment\\s*=\\s*(true|false)"
String validVersionsRegex = "validImageVersions = List\\.of\\((.+)\\);"
String currentUseDevelopmentRegex = "def currentUseDevelopment\\s*=\\s*(true|false)"

tasks.register('UpdateVersions') {
  doLast {
    def mavenExtFile = file('src/main/java/org/wpilib/gradlerio/wpi/WPIMavenExtension.java')
    def mavenExtText = mavenExtFile.text
    def toSet = "this.useDevelopment = false"
    if (useDevelopment) {
      toSet = "this.useDevelopment = true"
    }

    mavenExtFile.text = mavenExtText.replaceAll(mavenDevRegex, toSet)

    def thisFile = file('versionupdates.gradle')
    def gradleToSet = "def currentUseDevelopment"

    if (useDevelopment) {
      gradleToSet += " = true"
    } else {
      gradleToSet += " = false"
    }
    thisFile.text = thisFile.text.replaceAll(currentUseDevelopmentRegex, gradleToSet)


    def extFile = file('src/main/java/org/wpilib/gradlerio/wpi/WPIVersionsExtension.java')
    def extText = extFile.text

    def versionsArtifacts = configurations.gradleRioVersions.resolvedConfiguration.resolvedArtifacts.findAll {
      it.moduleVersion.id.group == 'org.wpilib' && it.name == 'wpilib-versions'
    }
    if (versionsArtifacts.size() != 1) {
      throw new GradleException("Expected one org.wpilib:wpilib-versions artifact, found ${versionsArtifacts.size()}")
    }

    def versionsArtifact = versionsArtifacts.first()
    def versionCatalogFiles = zipTree(versionsArtifact.file).matching {
      include 'libs.versions.toml'
    }.files
    if (versionCatalogFiles.size() != 1) {
      throw new GradleException("Expected wpilib-versions to contain one libs.versions.toml, found ${versionCatalogFiles.size()}")
    }

    def catalogVersions = [:]
    def inVersionsSection = false
    versionCatalogFiles.first().eachLine('UTF-8') { line ->
      def trimmedLine = line.trim()
      if (trimmedLine.startsWith('[')) {
        inVersionsSection = trimmedLine == '[versions]'
      } else if (inVersionsSection && trimmedLine && !trimmedLine.startsWith('#')) {
        def versionMatcher = trimmedLine =~ /^([A-Za-z0-9_-]+)\s*=\s*(["'])([^"']+)\2\s*(?:#.*)?$/
        if (versionMatcher.matches()) {
          catalogVersions[versionMatcher.group(1)] = versionMatcher.group(3)
        }
      }
    }

    def resolvedVersionMap = wpilibVersionKeys.collectEntries { key ->
      [(key): versionsArtifact.moduleVersion.id.version]
    }
    thirdPartyVersionMap.each { key, catalogKey ->
      def resolvedVersion = catalogVersions[catalogKey]
      if (resolvedVersion == null) {
        throw new GradleException("wpilib-versions is missing the '${catalogKey}' version required for ${key}")
      }
      resolvedVersionMap[key] = resolvedVersion
    }

    resolvedVersionMap.each { key, value ->
      def localRegex = regex.replace('placeholder', key)
      extText = extText.replaceAll(localRegex, "String ${key} = \"${value}\"".toString())
    }
    extFile.text = extText

    def buildFile = file('build.gradle')
    def buildText = buildFile.text
    resolvedVersionMap.each { key, value ->
      def localBuildRegex = buildRegex.replace('placeholder', key)
      buildText = buildText.replaceAll(localBuildRegex, "def ${key} = \"${value}\"".toString())
    }
    buildFile.text = buildText

    def allowedVersions = ""
    def first = true
    configurations.gradleRioVersions.resolvedConfiguration.resolvedArtifacts.each {
      if (it.classifier == "allowedimages") {
        def f = zipTree(it.file)
        f.visit {
          if (it.name == "allowed_images.txt") {
            it.file.eachLine {
              if (!first) {
                allowedVersions += ', '
              }
              first = false
              allowedVersions += "\"$it\""
            }
          }
        }
      }
    }

    def rootExtFile = file('src/main/java/org/wpilib/gradlerio/wpi/WPIExtension.java')
    def rootExtText = rootExtFile.text

    rootExtFile.text = rootExtText.replaceAll(validVersionsRegex, "validImageVersions = List.of($allowedVersions);")
  }
}
